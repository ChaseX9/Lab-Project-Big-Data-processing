services:
  kafka:
    image: apache/kafka-native:4.1.1
    container_name: projet_kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    networks:
      - projet-net

  spark:
    image: quay.io/jupyter/pyspark-notebook:spark-4.2.0
    container_name: projet_spark
    user: root
    ports:
      - "8888:8888"
      - "4040:4040"
      - "4041:4041"
    environment:
      NB_UID: ${UID:-1000}
      NB_GID: ${GID:-1000}
      CHOWN_EXTRA: /home/jovyan/projet/data
      # Makes `import imdb_project` and `import pyspark` work from jobs and
      # notebooks (the py4j version matches the pinned image tag).
      PYTHONPATH: /home/jovyan/projet/src:/usr/local/spark/python:/usr/local/spark/python/lib/py4j-0.10.9.9-src.zip
      # Spark settings read by imdb_project.spark.get_spark().
      SPARK_DRIVER_MEMORY: ${SPARK_DRIVER_MEMORY:-6g}
      SPARK_SHUFFLE_PARTITIONS: ${SPARK_SHUFFLE_PARTITIONS:-64}
      # Kafka address as seen from inside the Docker network.
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    volumes:
      - .:/home/jovyan/projet
    working_dir: /home/jovyan/projet
    networks:
      - projet-net
    depends_on:
      - kafka

networks:
  projet-net:
    driver: bridge
